name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions minimales : lecture du dépôt, écriture de la page, jeton OIDC
# pour l'action de déploiement officielle. Aucun secret n'est utilisé.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois. On laisse la production se terminer plutôt
# que de l'annuler en cours de route.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Quality checks and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # `npm ci` installe exactement le contenu de package-lock.json.
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Configure Pages
        # Renseigne la variable d'environnement utilisée par Astro pour `base`.
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
